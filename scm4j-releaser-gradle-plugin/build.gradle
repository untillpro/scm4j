plugins {
	id 'com.gradle.plugin-publish' version '1.3.1'
}

version = file('version').text.trim()

repositories {
	mavenCentral()
}

dependencies {
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.hamcrest:hamcrest-all:1.3'
}

jar {
	manifest.attributes (
		'Specification-Title': project.name,
		'Specification-Version': project.version.replaceAll(/-SNAPSHOT$/, ''),
		'Implementation-Title': project.name,
		'Implementation-Version': "${project.version} (${new Date().format('yyyy-MM-dd')})",
	)
}

test {
	useJUnit {
		excludeCategories 'io.github.scm4j.releaser.gradle.IntegrationTest'
	}
}

gradlePlugin {
	website = 'https://github.com/untillpro/scm4j/tree/main/scm4j-releaser-gradle-plugin'
	vcsUrl = 'https://github.com/untillpro/scm4j.git'

	plugins {
		create('scm4jReleaserGradlePlugin') {
			id = 'io.github.untillpro.scm4j-releaser-gradle-plugin'
			displayName = 'scm4j-releaser Gradle plugin'
			description = 'This plugin loads version and manageable dependencies from external files (version and mdeps)'
			implementationClass = 'io.github.scm4j.releaser.gradle.ReleaserGradlePlugin'
			tags.set(['scm', 'release-automation', 'release-helper', 'dependencies'])
		}
	}
}
