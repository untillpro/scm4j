plugins {
    id 'base'
}

def moduleMetadata = [
    'scm4j-deployer-api'          : [group: 'io.github.untillpro', java: JavaVersion.VERSION_1_8],
    'scm4j-deployer-engine'       : [group: 'io.github.untillpro', java: JavaVersion.VERSION_1_8],
    'scm4j-deployer-installers'   : [group: 'io.github.untillpro', java: JavaVersion.VERSION_1_8],
    'scm4j-installer'             : [group: 'io.github.untillpro', java: JavaVersion.VERSION_1_8],
    'scm4j-jenkins'               : [group: 'io.github.untillpro', java: JavaVersion.VERSION_1_7],
    'scm4j-releaser'              : [group: 'io.github.untillpro', java: JavaVersion.VERSION_1_8],
    'scm4j-vcs'                   : [group: 'io.github.untillpro', java: JavaVersion.VERSION_1_8],
    'scm4j-releaser-gradle-plugin': [group: 'io.github.untillpro', java: JavaVersion.VERSION_1_8],
]

subprojects {
    apply plugin: 'java-library'

    def metadata = moduleMetadata[project.name]
    group = metadata.group
    tasks.withType(AbstractArchiveTask).configureEach {
        archiveVersion.set('')
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(8)
        }
        sourceCompatibility = metadata.java
        targetCompatibility = metadata.java
        withSourcesJar()
        withJavadocJar()
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(Test).configureEach {
        useJUnit()
        testLogging {
            events 'failed'
            exceptionFormat = 'full'
        }
    }

    tasks.named('assemble') {
        dependsOn(tasks.named('sourcesJar'), tasks.named('javadocJar'))
    }

}

project(':scm4j-deployer-api') {
    dependencies {
        api 'org.apache.maven.resolver:maven-resolver-api:1.1.0'

        compileOnly 'org.projectlombok:lombok:1.16.18'
        annotationProcessor 'org.projectlombok:lombok:1.16.18'

        testImplementation 'junit:junit:4.12'
    }
}

project(':scm4j-deployer-engine') {
    dependencies {
        api project(':scm4j-deployer-api')
        api 'com.google.guava:guava:20.0'
        api 'org.apache.httpcomponents:httpclient:4.5.3'
        api 'commons-io:commons-io:2.5'
        api 'com.google.code.gson:gson:2.8.2'
        api 'commons-cli:commons-cli:1.4'
        api 'org.slf4j:slf4j-api:1.7.25'
        api 'org.apache.maven.resolver:maven-resolver-api:1.1.0'
        api 'org.apache.maven.resolver:maven-resolver-util:1.1.0'
        api 'org.apache.maven.resolver:maven-resolver-spi:1.1.0'
        api 'org.apache.maven.resolver:maven-resolver-impl:1.1.0'
        api 'org.apache.maven.resolver:maven-resolver-connector-basic:1.1.0'
        api 'org.apache.maven.resolver:maven-resolver-transport-file:1.1.0'
        api 'org.apache.maven.resolver:maven-resolver-transport-http:1.1.0'
        api 'org.apache.maven:maven-resolver-provider:3.5.0'

        compileOnly 'org.projectlombok:lombok:1.16.18'
        annotationProcessor 'org.projectlombok:lombok:1.16.18'

        testImplementation 'junit:junit:4.12'
        testImplementation 'org.mockito:mockito-all:1.9.5'
    }

}

project(':scm4j-deployer-installers') {
    dependencies {
        api project(':scm4j-deployer-api')
        api project(':scm4j-releaser-gradle-plugin')
        api 'org.slf4j:slf4j-log4j12:1.7.25'
        api 'commons-io:commons-io:2.5'
        api 'org.apache.commons:commons-lang3:3.7'
        api 'com.github.vatbub:mslinks:1.0.4'

        compileOnly 'org.projectlombok:lombok:1.16.18'
        annotationProcessor 'org.projectlombok:lombok:1.16.18'

        testImplementation 'junit:junit:4.12'
    }
}

project(':scm4j-installer') {
    dependencies {
        api project(':scm4j-deployer-engine')
        api 'ch.qos.logback:logback-classic:1.2.3'
        api 'commons-cli:commons-cli:1.4'

        def currentOs = org.gradle.internal.os.OperatingSystem.current()
        def platform = currentOs.windows ? 'win32.win32' : (currentOs.linux ? 'gtk.linux' : (currentOs.macOsX ? 'cocoa.macosx' : 'unknown'))
        def architecture = System.getProperty('os.arch').contains('64') ? 'x86_64' : 'x86'
        def swtCoordinates = "org.eclipse.swt:org.eclipse.swt.${platform}.${architecture}:4.3"
        compileOnly swtCoordinates
        runtimeOnly swtCoordinates

        testImplementation 'junit:junit:4.12'
    }

    tasks.named('jar', Jar) {
        manifest.attributes('Main-Class': 'org.scm4j.installer.Installer')
    }
}

project(':scm4j-jenkins') {
    dependencies {
        api 'commons-io:commons-io:2.4'
        api 'com.google.code.gson:gson:2.8.0'
        api 'org.apache.httpcomponents:httpclient:4.5.2'
        api 'commons-httpclient:commons-httpclient:3.1'

        testImplementation 'junit:junit:4.12'
        testImplementation 'org.mockito:mockito-core:2.0.62-beta'
        testImplementation 'xmlunit:xmlunit:1.6'
    }
}

project(':scm4j-releaser') {
    apply plugin: 'maven-publish'

    def requestedReleaserVersion = providers.gradleProperty('releaserVersion')
            .map { it.trim() }
    def publicationReleaserVersion = requestedReleaserVersion.getOrElse('')

    sourceSets {
        inv {
            java.srcDir 'src/inv/java'
            compileClasspath = sourceSets.test.runtimeClasspath
            runtimeClasspath = output + compileClasspath
        }
    }

    dependencies {
        api project(':scm4j-vcs')
        api 'com.google.guava:guava:23.0'
        api 'org.apache.commons:commons-lang3:3.5'
        api 'commons-io:commons-io:2.6'
        api 'org.yaml:snakeyaml:1.18'
        api 'org.slf4j:slf4j-simple:1.7.21'
        api 'com.diogonunes:JCDP:2.0.3.1'

        compileOnly 'org.projectlombok:lombok:1.16.18'
        annotationProcessor 'org.projectlombok:lombok:1.16.18'

        testImplementation 'com.github.stefanbirkner:system-rules:1.16.1'
        testImplementation 'junit:junit:4.12'
        testImplementation 'org.mockito:mockito-core:2.0.62-beta'
        testImplementation 'nl.jqno.equalsverifier:equalsverifier:2.3'
        testImplementation 'org.hamcrest:hamcrest-all:1.3'
    }

    tasks.named('test', Test) {
        jvmArgs '-Xmx128m'
    }

    def fatJar = tasks.register('fatJar', Jar) {
        dependsOn(tasks.named('classes'))
        dependsOn(configurations.runtimeClasspath)
        archiveFileName.set('fat-scm4j-releaser.jar')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        manifest.attributes(
                'Main-Class': 'org.scm4j.releaser.cli.CLI',
                'Specification-Title': project.name,
                'Implementation-Title': project.name,
        )
        from {
            sourceSets.main.runtimeClasspath.collect { it.directory ? it : zipTree(it) }
        }
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }

    publishing {
        publications {
            releaser(MavenPublication) {
                groupId = project.group.toString()
                artifactId = project.name
                version = publicationReleaserVersion ?: 'unspecified'
                artifact(fatJar)
            }
        }
        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/untillpro/scm4j')
                credentials {
                    username = System.getenv('GITHUB_ACTOR')
                    password = System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }

    tasks.withType(org.gradle.api.publish.maven.tasks.AbstractPublishToMaven).configureEach {
        doFirst {
            if (!publicationReleaserVersion) {
                throw new GradleException('Publishing scm4j-releaser requires a non-blank -PreleaserVersion=<version> value.')
            }
        }
    }

    tasks.register('run', JavaExec) {
        dependsOn(tasks.named('classes'))
        description = 'Test CLI'
        mainClass.set('org.scm4j.releaser.cli.CLI')
        classpath = sourceSets.main.runtimeClasspath
        if (project.hasProperty('a')) {
            args(project.property('a').toString().split(','))
        }
    }
}

project(':scm4j-vcs') {
    dependencies {
        implementation 'dev.failsafe:failsafe:3.3.2'
        api 'org.eclipse.jgit:org.eclipse.jgit:5.13.5.202508271544-r'
        api 'org.tmatesoft.svnkit:svnkit:1.8.14'
        api 'org.apache.commons:commons-lang3:3.5'
        api 'commons-io:commons-io:2.6'

        testImplementation 'junit:junit:4.12'
        testImplementation 'org.mockito:mockito-core:2.0.62-beta'
        testImplementation 'nl.jqno.equalsverifier:equalsverifier:2.3'
    }
}

tasks.named('build') {
    dependsOn(':scm4j-releaser:build')
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs every test in every Gradle subproject.'
    dependsOn(subprojects.collect { it.tasks.named('test') })
}
