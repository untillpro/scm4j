    }

}

project(':scm4j-deployer-installers') {
    dependencies {
        api project(':scm4j-deployer-api')
        api project(':scm4j-releaser-gradle-plugin')
        api 'org.slf4j:slf4j-log4j12:1.7.25'
        api 'commons-io:commons-io:2.5'
        api 'org.apache.commons:commons-lang3:3.7'
        api 'com.github.vatbub:mslinks:1.0.4'

        compileOnly 'org.projectlombok:lombok:1.16.18'
        annotationProcessor 'org.projectlombok:lombok:1.16.18'

        testImplementation 'junit:junit:4.12'
    }
}

project(':scm4j-installer') {
    dependencies {
        api project(':scm4j-deployer-engine')
        api 'ch.qos.logback:logback-classic:1.2.3'
        api 'commons-cli:commons-cli:1.4'

        def currentOs = org.gradle.internal.os.OperatingSystem.current()
        def platform = currentOs.windows ? 'win32.win32' : (currentOs.linux ? 'gtk.linux' : (currentOs.macOsX ? 'cocoa.macosx' : 'unknown'))
        def architecture = System.getProperty('os.arch').contains('64') ? 'x86_64' : 'x86'
        def swtCoordinates = "org.eclipse.swt:org.eclipse.swt.${platform}.${architecture}:4.3"
        compileOnly swtCoordinates
        runtimeOnly swtCoordinates

        testImplementation 'junit:junit:4.12'
    }

    tasks.named('jar', Jar) {
        manifest.attributes('Main-Class': 'org.scm4j.installer.Installer')
    }
}

project(':scm4j-jenkins') {
    dependencies {
        api 'commons-io:commons-io:2.4'
        api 'com.google.code.gson:gson:2.8.0'
        api 'org.apache.httpcomponents:httpclient:4.5.2'
        api 'commons-httpclient:commons-httpclient:3.1'

        testImplementation 'junit:junit:4.12'
        testImplementation 'org.mockito:mockito-core:2.0.62-beta'
        testImplementation 'xmlunit:xmlunit:1.6'
    }
}

project(':scm4j-releaser') {
    apply plugin: 'maven-publish'

    def requestedReleaserVersion = providers.gradleProperty('releaserVersion')
            .map { it.trim() }
    def publicationReleaserVersion = requestedReleaserVersion.getOrElse('')

    sourceSets {
        inv {
            java.srcDir 'src/inv/java'
            compileClasspath = sourceSets.test.runtimeClasspath
            runtimeClasspath = output + compileClasspath
        }
    }

    dependencies {
        api project(':scm4j-vcs')
        api 'com.google.guava:guava:23.0'
        api 'org.apache.commons:commons-lang3:3.5'
        api 'commons-io:commons-io:2.6'
        api 'org.yaml:snakeyaml:1.18'
        api 'org.slf4j:slf4j-simple:1.7.21'
        api 'com.diogonunes:JCDP:2.0.3.1'

        compileOnly 'org.projectlombok:lombok:1.16.18'
        annotationProcessor 'org.projectlombok:lombok:1.16.18'

        testImplementation 'com.github.stefanbirkner:system-rules:1.16.1'
        testImplementation 'junit:junit:4.12'
        testImplementation 'org.mockito:mockito-core:2.0.62-beta'
        testImplementation 'nl.jqno.equalsverifier:equalsverifier:2.3'
        testImplementation 'org.hamcrest:hamcrest-all:1.3'
    }

    tasks.named('test', Test) {
        jvmArgs '-Xmx128m'
    }

    def fatJar = tasks.register('fatJar', Jar) {
        dependsOn(tasks.named('classes'))
        dependsOn(configurations.runtimeClasspath)
        archiveFileName.set('fat-scm4j-releaser.jar')
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        manifest.attributes(
                'Main-Class': 'org.scm4j.releaser.cli.CLI',
                'Specification-Title': project.name,
                'Implementation-Title': project.name,
        )
        from {
            sourceSets.main.runtimeClasspath.collect { it.directory ? it : zipTree(it) }
        }
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }

    publishing {
        publications {
            releaser(MavenPublication) {
                groupId = project.group.toString()
                artifactId = project.name
                version = publicationReleaserVersion ?: 'unspecified'
                artifact(fatJar)
            }
        }
        repositories {
            maven {
                name = 'GitHubPackages'
                url = uri('https://maven.pkg.github.com/untillpro/scm4j')
                credentials {
                    username = System.getenv('GITHUB_ACTOR')
                    password = System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }

    tasks.withType(org.gradle.api.publish.maven.tasks.AbstractPublishToMaven).configureEach {
        doFirst {
            if (!publicationReleaserVersion) {
                throw new GradleException('Publishing scm4j-releaser requires a non-blank -PreleaserVersion=<version> value.')
            }
        }
    }

    tasks.register('run', JavaExec) {
        dependsOn(tasks.named('classes'))
        description = 'Test CLI'
        mainClass.set('org.scm4j.releaser.cli.CLI')
        classpath = sourceSets.main.runtimeClasspath
        if (project.hasProperty('a')) {
            args(project.property('a').toString().split(','))
        }
    }
}

project(':scm4j-releaser-gradle-plugin') {
    apply plugin: 'com.gradle.plugin-publish'

    tasks.named('jar', Jar) {
        manifest.attributes(
                'Specification-Title': project.name,
                'Specification-Version': project.version.toString().replaceAll(/-SNAPSHOT$/, ''),
                'Implementation-Title': project.name,
                'Implementation-Version': "${project.version} (${new Date().format('yyyy-MM-dd')})",
        )
    }

    def legacyApiSourceDir = layout.buildDirectory.dir('generated/sources/legacyApi/java/main')
    def generateLegacyApiSources = tasks.register('generateLegacyApiSources') {
        outputs.dir(legacyApiSourceDir)
        doLast {
            def packageDir = legacyApiSourceDir.get().dir('org/scm4j/releaser/gradle').asFile
            packageDir.mkdirs()

            new File(packageDir, 'ManagableDependency.java').text = '''package org.scm4j.releaser.gradle;

public class ManagableDependency {
    private String group;
    private String name;
    private String classifier;
    private String ext;
    private String version;
    private String configuration;

    public String getGroup() { return group; }
    public void setGroup(String group) { this.group = group; }
    public String getName() { return name; }
    public void setName(String name) { this.name = name; }
    public String getClassifier() { return classifier; }
    public void setClassifier(String classifier) { this.classifier = classifier; }
    public String getExt() { return ext; }
    public void setExt(String ext) { this.ext = ext; }
    public String getVersion() { return version; }
    public void setVersion(String version) { this.version = version; }
    public String getConfiguration() { return configuration; }
    public void setConfiguration(String configuration) { this.configuration = configuration; }
}
'''

            new File(packageDir, 'ManagableDependencyParser.java').text = '''package org.scm4j.releaser.gradle;

import java.io.BufferedReader;
import java.io.IOException;
import java.io.InputStream;
import java.io.InputStreamReader;
import java.util.ArrayList;
import java.util.List;
import java.util.regex.Matcher;
import java.util.regex.Pattern;

public final class ManagableDependencyParser {
    private ManagableDependencyParser() {
    }

    public static List<ManagableDependency> parse(InputStream is) throws IOException {
        if (is == null) return null;
        List<ManagableDependency> result = new ArrayList<>();
        Pattern pattern = Pattern.compile(String.format("%1$s(?<group>%2$s):(?<name>%2$s):(?<ver>%2$s)?"
                + "(?::(?<clf>%2$s))?(?:@(?<ext>%2$s))?%1$s(?:#%1$s(?<cfg>%2$s)?%1$s)?",
                "[ \\t]*", "[a-zA-Z0-9._-]+"));
        try (BufferedReader br = new BufferedReader(new InputStreamReader(is))) {
            String line;
            while ((line = br.readLine()) != null) {
                Matcher matcher = pattern.matcher(line);
                if (matcher.matches()) {
                    ManagableDependency dependency = new ManagableDependency();
                    dependency.setGroup(matcher.group("group"));
                    dependency.setName(matcher.group("name"));
                    dependency.setClassifier(matcher.group("clf"));
                    dependency.setExt(matcher.group("ext"));
                    dependency.setVersion(matcher.group("ver"));
                    dependency.setConfiguration(matcher.group("cfg"));
                    result.add(dependency);
                }
            }
        }
        return result;
    }
}
'''
        }
    }

    sourceSets.main.java.srcDir(generateLegacyApiSources)

    dependencies {
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.hamcrest:hamcrest-all:1.3'
    }

    gradlePlugin {
        website = 'https://github.com/untillpro/scm4j/tree/main/scm4j-releaser-gradle-plugin'
        vcsUrl = 'https://github.com/untillpro/scm4j.git'

        plugins {
            scm4jReleaserGradlePlugin {
                id = 'io.github.untillpro.scm4j-releaser-gradle-plugin'
                displayName = 'scm4j-releaser Gradle plugin'
                description = 'This plugin loads version and manageable dependencies from external files (version and mdeps)'
                implementationClass = 'io.github.scm4j.releaser.gradle.ReleaserGradlePlugin'
                tags.set(['scm', 'release-automation', 'release-helper', 'dependencies'])
            }
        }
    }
}

project(':scm4j-vcs') {
    dependencies {
        api 'org.eclipse.jgit:org.eclipse.jgit:5.13.5.202508271544-r'
        api 'org.tmatesoft.svnkit:svnkit:1.8.14'
        api 'org.apache.commons:commons-lang3:3.5'
        api 'commons-io:commons-io:2.6'

        testImplementation 'junit:junit:4.12'
        testImplementation 'org.mockito:mockito-core:2.0.62-beta'
        testImplementation 'nl.jqno.equalsverifier:equalsverifier:2.3'
    }
}

tasks.named('build') {
    dependsOn(':scm4j-releaser:build')
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs every test in every Gradle subproject.'
    dependsOn(subprojects.collect { it.tasks.named('test') })
}
