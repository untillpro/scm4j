name: Test

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 4 * * *'
      timezone: Europe/Moscow

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # The build requires JDK 8, but setup-java supports Oracle JDK only for
      # version 17 and later. Temurin provides a maintained OpenJDK 8 build.
      - name: Set up Temurin JDK 8
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Run tests
        if: github.event_name != 'schedule'
        run: ./gradlew test

      - name: Run scheduled releaser workflow tests on Git and SVN
        if: github.event_name == 'schedule'
        env:
          SCM4J_WORKFLOW_TEST_ALL_VCS: 'true'
        run: ./gradlew :scm4j-releaser:test --tests 'org.scm4j.releaser.Workflow*Test'
