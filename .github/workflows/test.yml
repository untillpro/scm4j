name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # The build requires JDK 8, but setup-java supports Oracle JDK only for
      # version 17 and later. Temurin provides a maintained OpenJDK 8 build.
      - name: Set up Temurin JDK 8
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test
