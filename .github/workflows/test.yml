name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:
    inputs:
      all_vcs:
        description: Run workflow integration tests on Git and SVN
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SCM4J_WORKFLOW_TEST_ALL_VCS: ${{ inputs.all_vcs }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # The build requires JDK 8, but setup-java supports Oracle JDK only for
      # version 17 and later. Temurin provides a maintained OpenJDK 8 build.
      - name: Set up Temurin JDK 8
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-provider: basic

      - name: Run tests
        run: ./gradlew test
