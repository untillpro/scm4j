#
# Components configuration file
#
# Map component coordinates to another component properties, e.g. repository url
#

# Coordinates which matches `org.scm4j:(.*):`. Repository name is constructed from coorinates name using regular expression

#org.scm4j:(.*):
#  url: https://github.com/scm4j/$1\.git

# Components stored in subfolders of the same repository can declare an optional `subfolder`.
# Capture groups from the component-coordinate pattern are substituted in `subfolder` as they are in `url`.

#eu\.untill\.sdk\.drivers:(.*):
#  url: https://dev.untill.com/git/untill/untill-drivers
#  subfolder: components/$1

# Two components in the same repository

#component1|component2:
#  url: http://mycompany.com/repos/components

# `svn` type repository (`git` is default)

#mycompany:component3:
#  url: http://mycompany.com/repos/component3
#  type: svn
  
# Repository where 
# a) `release` branches are prefixed with `B` (default is `release/`) 
# b) `develop` branch is named `branches/develop` (by default it is `trunk` or `master` according to the repository type).

#mycompany:component4:
#  url: http://mycompany.com/repos/component4
#  type: svn
#  releaseBranchPrefix: B
#  developBranch: branches/develop

# All repos will have `rel` as a `release` branch prefix by default, if not specified above
#~:
#  releaseBranchPrefix: rel/
